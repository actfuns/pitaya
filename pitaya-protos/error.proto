syntax = "proto3";

package protos;
option csharp_namespace = "NPitaya.Protos";
option go_package = "github.com/topfreegames/pitaya/v2/protos";

message Error {
  int32               code     = 1;
  int32               level    = 2;
  string              message  = 3;
  map<string, string> metadata = 4;
}
